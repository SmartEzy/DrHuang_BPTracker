<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #8FA3B8;
      --primary-dark: #768B9E;
      --bg-color: #F4F6F8;
      --card-bg: #FFFFFF;
      --text-main: #495057;
      --border-color: #CED4DA;
      --special-color: #A39193;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    }
    .container {
      width: 100%; max-width: 400px; background: var(--card-bg);
      padding: 24px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: var(--primary-dark); text-align: center; font-size: 20px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; }
    #notesGroup { display: none; }
    
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--text-main); }
    
    input[type="number"], input[type="text"] {
      width: 100%; padding: 10px 8px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #FAFAFA;
    }
    
    /* 特別針對日期與時間縮減內距與字體，避免在手機上重疊 */
    input[type="date"], input[type="time"] {
      width: 100%; padding: 8px 4px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 13px; color: var(--text-main); background: #FAFAFA;
    }

    .radio-group { display: flex; gap: 15px; margin-top: 5px; }
    .radio-group label { font-weight: normal; font-size: 15px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    
    button {
      width: 100%; padding: 12px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    button:hover { background-color: var(--primary-dark); }
    
    /* 列表分欄樣式 (CSS Grid) */
    .list-header {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1.5fr; /* 重新調整欄位寬度比例 */
      gap: 5px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold; font-size: 13px; color: var(--primary-dark);
      text-align: center;
    }
    .list-header div:first-child { text-align: left; }

    .record-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .record-item:last-child { border-bottom: none; }
    
    .record-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1.5fr;
      gap: 5px;
      align-items: center;
      font-size: 15px; color: var(--text-main);
      text-align: center;
    }
    
    /* 日期時間欄位分行，縮小字體 */
    .record-row .dt-col {
      text-align: left; font-size: 12px; line-height: 1.3;
    }
    .dt-col span { color: #888; }
    
    /* Type 與 Notes 整合欄位 */
    .record-row .type-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .type-col .note-text {
      font-size: 11px; color: #888; margin-top: 4px; text-align: center;
      line-height: 1.1; word-break: break-word;
    }

    /* 圓底標記樣式 */
    .circle-badge {
      display: inline-flex; justify-content: center; align-items: center;
      width: 20px; height: 20px; border-radius: 50%;
      font-size: 11px; font-weight: bold; color: white;
    }
    .badge-regular { background-color: var(--primary-color); }
    .badge-special { background-color: var(--special-color); }
    
  </style>
</head>
<body>

  <div class="container">
    <h2>BP Tracker</h2>
    <form id="bpForm">
      <!-- Row 1: Date & Time -->
      <div class="form-group" style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>Date</label><input type="date" id="date" required>
        </div>
        <div style="flex:1;">
          <label>Time</label><input type="time" id="time" required>
        </div>
      </div>
      
      <!-- Row 2: Type -->
      <div class="form-group">
        <label>Type</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="Regular" checked> Regular</label>
          <label><input type="radio" name="type" value="Special"> Special</label>
        </div>
      </div>
      
      <!-- Row 3: Notes (預設隱藏) -->
      <div class="form-group" id="notesGroup">
        <label>Notes</label><input type="text" id="notes" placeholder="e.g., after exercise, feeling dizzy...">
      </div>
      
      <!-- Row 4: SBP / DBP / HR 一列呈現 -->
      <div class="form-group" style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>SBP</label><input type="number" id="systolic" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <label>DBP</label><input type="number" id="diastolic" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <label>HR</label><input type="number" id="heartRate" inputmode="numeric" pattern="[0-9]*" required>
        </div>
      </div>
      
      <button type="submit" id="submitBtn">Save Record</button>
      <div id="status" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <div class="container">
    <h2>Recent Records</h2>
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    // 使用您專屬的 API 網址
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';

    // 預設當下時間
    const now = new Date();
    document.getElementById('date').value = now.toLocaleDateString('en-CA');
    document.getElementById('time').value = now.toLocaleTimeString('en-GB', { hour: "2-digit", minute: "2-digit" });

    // 監聽 Radio Button 切換 Notes 顯示狀態
    const typeRadios = document.querySelectorAll('input[name="type"]');
    const notesGroup = document.getElementById('notesGroup');
    const notesInput = document.getElementById('notes');

    typeRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'Special') {
          notesGroup.style.display = 'block';
        } else {
          notesGroup.style.display = 'none';
          notesInput.value = '';
        }
      });
    });

    async function loadData() {
      try {
        let response = await fetch(API_URL);
        let data = await response.json();
        
        let html = `
          <div class="list-header">
            <div>Date Time</div>
            <div>BP</div>
            <div>HR</div>
            <div>Type</div>
          </div>
        `;

        if (data.length === 0) {
          html += `<div style="text-align:center; padding: 20px; color: #888;">No records found.</div>`;
        } else {
          data.forEach(item => {
            let isRegular = (item.type === 'Regular' || item.type === '規律測量');
            let badgeClass = isRegular ? 'badge-regular' : 'badge-special';
            let badgeLetter = isRegular ? 'R' : 'S';

            let formattedDate = item.date.replace(/-/g, '/');
            
            // 列表格式：日期時間分兩行，Notes顯示於Type欄位下方
            html += `
              <div class="record-item">
                <div class="record-row">
                  <div class="dt-col">${formattedDate}<br><span>${item.time}</span></div>
                  <div>${item.systolic}/${item.diastolic}</div>
                  <div>${item.heartRate}</div>
                  <div class="type-col">
                    <span class="circle-badge ${badgeClass}">${badgeLetter}</span>
                    ${item.notes ? `<span class="note-text">${item.notes}</span>` : ''}
                  </div>
                </div>
              </div>
            `;
          });
        }
        document.getElementById('recordsList').innerHTML = html;
      } catch (err) {
        document.getElementById('recordsList').innerHTML = 'Failed to load data. Please check API settings.';
      }
    }

    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true; btn.innerText = 'Saving...';

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        type: document.querySelector('input[name="type"]:checked').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        status.innerText = '✅ Saved Successfully!';
        status.style.color = 'green';
        setTimeout(() => { status.innerText = ''; }, 3000);
        
        document.getElementById('bpForm').reset();
        document.getElementById('date').value = new Date().toLocaleDateString('en-CA');
        document.getElementById('time').value = new Date().toLocaleTimeString('en-GB', { hour: "2-digit", minute: "2-digit" });
        notesGroup.style.display = 'none'; 
        loadData();
      } catch (error) {
        status.innerText = '❌ Failed to save. Please try again.';
        status.style.color = 'red';
      } finally {
        btn.disabled = false; btn.innerText = 'Save Record';
      }
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
