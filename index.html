<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #8FA3B8;
      --primary-dark: #495057; /* 深灰色 */
      --bg-color: #F4F6F8;
      --text-main: #333333;
      --border-color: #CED4DA;
    }
    /* 移除 body 的 padding 以實現滿版橫幅 */
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 0; 
    }
    
    /* 滿版橫幅設計 */
    .banner {
      background-color: var(--primary-dark);
      color: white;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .banner select {
      background: #FFFFFF; color: var(--primary-dark);
      border: none; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: bold;
    }

    /* 內容容器 */
    .container {
      width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box;
    }

    .form-group { margin-bottom: 12px; }
    
    input[type="number"], input[type="text"], input[type="date"], input[type="time"] {
      width: 100%; padding: 12px 10px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #FFFFFF;
    }
    
    /* 調整 Placeholder 顏色 */
    ::placeholder { color: #A0AAB5; }

    button {
      width: 100%; padding: 14px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px;
    }
    button:hover { background-color: #768B9E; }
    
    /* 列表分欄樣式 (改為三欄: DateTime, BP, HR) */
    .list-header {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr; 
      gap: 5px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold; font-size: 13px; color: var(--primary-dark);
      text-align: center;
    }
    .list-header div:first-child { text-align: left; }

    .record-item {
      padding: 12px 0; border-bottom: 1px solid var(--border-color);
    }
    
    .record-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr;
      gap: 5px;
      align-items: center;
      font-size: 15px; color: var(--text-main);
      text-align: center;
    }
    
    .record-row .dt-col { text-align: left; font-size: 13px; line-height: 1.4; }
    .dt-col span { color: #666; font-size: 12px; }
    
    /* 備註樣式獨立成行 */
    .record-note {
      font-size: 12px; color: #777; margin-top: 6px; text-align: left;
      background-color: #E9ECEF; padding: 6px 10px; border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- 輸入區滿版橫幅 -->
  <div class="banner">BP Tracker</div>
  
  <div class="container">
    <form id="bpForm">
      <!-- Date & Time 同列 -->
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex: 1;">
          <input type="date" id="date" required>
        </div>
        <div style="flex: 1;">
          <input type="time" id="time" required>
        </div>
      </div>
      
      <!-- SBP, DBP, HR 同列 -->
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <input type="number" id="systolic" placeholder="SBP" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <input type="number" id="diastolic" placeholder="DBP" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <input type="number" id="heartRate" placeholder="HR" inputmode="numeric" pattern="[0-9]*" required>
        </div>
      </div>
      
      <!-- Notes 置底 -->
      <div class="form-group">
        <input type="text" id="notes" placeholder="Notes (e.g., dizzy, felt unwell...)">
      </div>
      
      <button type="submit" id="submitBtn">Save Record</button>
      <div id="status" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <!-- 列表區滿版橫幅與選單 -->
  <div class="banner" style="margin-top: 10px;">
    <span>Recent Records</span>
    <select id="limitSelect">
      <option value="7days">Last 7 Days</option>
      <option value="30days">Last 30 Days</option>
      <option value="20" selected>Last 20</option>
      <option value="all">All</option>
    </select>
  </div>
  
  <div class="container" style="padding-top: 10px;">
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    // ⚠️ 已經替換為您的 API URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';
    
    let allRecords = [];

    // 初始化當下時間
    const now = new Date();
    document.getElementById('date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    // 渲染列表 (包含時間與數量篩選)
    function renderList() {
      const limitVal = document.getElementById('limitSelect').value;
      let displayData = [];

      // 處理篩選邏輯
      if (limitVal === '7days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
        displayData = allRecords.filter(r => new Date(r.date) >= cutoff);
      } else if (limitVal === '30days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
        displayData = allRecords.filter(r => new Date(r.date) >= cutoff);
      } else if (limitVal === 'all') {
        displayData = allRecords;
      } else {
        displayData = allRecords.slice(0, parseInt(limitVal));
      }

      let html = `
        <div class="list-header">
          <div>Date Time</div><div>BP</div><div>HR</div>
        </div>
      `;

      if (displayData.length === 0) {
        html += `<div style="text-align:center; padding: 20px; color: #888;">No records found.</div>`;
      } else {
        displayData.forEach(item => {
          // 強制格式轉換為 YYYY/M/D (去除 0)
          let dateObj = new Date(item.date);
          let formattedDate = isNaN(dateObj) ? item.date.replace(/-/g, '/') : `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
          
          // 強制擷取時間並去除小時與分鐘前導 0 (例 08:05 -> 8:5)
          let timeParts = item.time.match(/(\d+):(\d+)/);
          let formattedTime = item.time;
          if (timeParts) {
             formattedTime = `${parseInt(timeParts[1], 10)}:${parseInt(timeParts[2], 10)}`;
          }

          html += `
            <div class="record-item">
              <div class="record-row">
                <div class="dt-col">${formattedDate}<br><span>${formattedTime}</span></div>
                <div>${item.systolic}/${item.diastolic}</div>
                <div>${item.heartRate}</div>
              </div>
              ${item.notes ? `<div class="record-note">${item.notes}</div>` : ''}
            </div>
          `;
        });
      }
      document.getElementById('recordsList').innerHTML = html;
    }

    document.getElementById('limitSelect').addEventListener('change', renderList);

    // 獲取資料
    async function loadData() {
      try {
        let response = await fetch(API_URL);
        allRecords = await response.json();
        renderList();
      } catch (err) {
        document.getElementById('recordsList').innerHTML = '<div style="text-align:center; color:red; padding:20px;">Failed to load data. Please ensure you deployed a "New Version" in Apps Script.</div>';
      }
    }

    // 提交表單
    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true; btn.innerText = 'Saving...';

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        status.innerText = '✅ Saved!';
        status.style.color = 'green';
        setTimeout(() => { status.innerText = ''; }, 3000);
        
        document.getElementById('bpForm').reset();
        let curr = new Date();
        document.getElementById('date').value = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
        document.getElementById('time').value = `${String(curr.getHours()).padStart(2,'0')}:${String(curr.getMinutes()).padStart(2,'0')}`;
        
        loadData();
      } catch (error) {
        status.innerText = '❌ Failed.';
        status.style.color = 'red';
      } finally {
        btn.disabled = false; btn.innerText = 'Save Record';
      }
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
