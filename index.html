<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- 終極狀態列破解：強迫 Safari 讀取淺灰色，無視深色模式 -->
  <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <title>BP Tracker</title>
  
  <link rel="manifest" href="manifest.json?v=4">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  
  <style>
    :root {
      --primary-color: #8FA3B8;
      --primary-dark: #495057; 
      --bg-color: #F4F6F8;
      --text-main: #333333;
      --border-color: #CED4DA;
      --danger-color: #D32F2F; 
    }
    /* 強制 body 為淺灰色，避免 Safari 亂抓顏色 */
    html, body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 0; 
    }
    
    .banner {
      background-color: var(--primary-dark);
      color: white;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .refresh-btn {
      background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0; display: flex; align-items: center;
    }

    .container {
      width: 100%; max-width: 500px; margin: 0 auto; padding: 15px 20px; box-sizing: border-box;
    }

    .form-group { margin-bottom: 12px; }
    
    .date-time-layout {
      display: flex; justify-content: space-between; width: 100%;
    }
    .date-time-layout .date-box { width: 56%; }
    .date-time-layout .time-box { width: 41%; }
    .date-time-layout input {
      width: 100%; padding: 12px 2px; font-size: 16px; text-align: center;
      box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 6px; 
      color: var(--text-main); background: #FFFFFF; -webkit-appearance: none;
    }
    
    input[type="number"], input[type="text"] {
      width: 100%; padding: 12px 8px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #FFFFFF;
    }
    ::placeholder { color: #A0AAB5; }

    .bp-hr-row {
      display: flex; align-items: center; width: 100%;
    }
    .bp-hr-row input {
      flex: 1; min-width: 0; text-align: center; padding: 12px 4px;
    }
    .symbol { font-size: 18px; color: #333; font-weight: bold; margin: 0 4px; }
    .unit { font-size: 13px; color: #333; font-weight: bold; margin: 0 4px; }

    .notes-save-row {
      display: flex; gap: 8px; width: 100%; align-items: center;
    }
    .notes-save-row input {
      flex: 1; min-width: 0; 
    }
    .notes-save-row button.primary-btn {
      width: 105px; 
      margin-top: 0; padding: 12px 0; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
      transition: background-color 0.2s;
    }
    .notes-save-row button.primary-btn:hover { background-color: #768B9E; }
    
    .capsule-group {
      display: flex; background-color: #343A40; border-radius: 20px; padding: 3px;
    }
    .capsule-btn {
      background: transparent; color: #A0AAB5; border: none; padding: 6px 12px;
      font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 18px;
      transition: all 0.2s;
    }
    .capsule-btn.active {
      background-color: #FFFFFF; color: var(--primary-dark);
    }

    .sticky-top-panel {
      position: -webkit-sticky; 
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color); 
      box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1); 
      padding-top: env(safe-area-inset-top); 
      
      /* 欺騙 Safari 狀態列的終極絕招：加一條 1px 隱形淺灰邊框 */
      border-top: 1px solid var(--bg-color);
    }

    /* --- 重調網格比例，解決間距過大/過近的問題 --- */
    .list-header {
      display: grid;
      grid-template-columns: 1.8fr 1.1fr 2.3fr 1.2fr 1.6fr; 
      gap: 4px; 
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-dark);
      font-weight: bold; font-size: 14px; 
      color: var(--primary-dark); text-align: center;
    }
    .list-header div:first-child, .list-header div:last-child { text-align: left; }
    
    /* 讓 HR 欄位置中，但文字靠右，解決過度擠壓 Notes 的問題 */
    .list-header div:nth-child(4) { 
      justify-self: center; width: 36px; text-align: right; padding-right: 0; 
    }

    .record-row {
      display: grid; 
      grid-template-columns: 1.8fr 1.1fr 2.3fr 1.2fr 1.6fr;
      gap: 4px; align-items: center; 
      padding: 2px 0; 
      font-size: 15px; 
      line-height: 1.1; 
      color: var(--text-main); text-align: center;
      font-variant-numeric: tabular-nums; 
    }
    .record-row div:first-child, .record-row div:last-child { text-align: left; }
    
    /* 讓 HR 數據置中於欄位，但數字本身靠右對齊 */
    .record-row div:nth-child(4) { 
      justify-self: center; width: 36px; text-align: right; padding-right: 0; font-weight: bold; 
    }
    
    .bp-col-align {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px; align-items: center;
    }
    .bp-sys { text-align: right; font-weight: bold; }
    .bp-slash { color: #888; font-weight: normal; } 
    .bp-dia { text-align: left; font-weight: bold; }

    .note-col { font-size: 13px; color: #666; word-break: break-word; line-height: 1.1; font-variant-numeric: normal; }
    
    .high-bp { color: var(--danger-color); font-weight: bold; }
    
    .day-divider { border-top: 2px solid var(--primary-color); margin: 3px 0; }
    .item-divider { border-top: 1px dashed #E2E8F0; margin: 3px 0; }

  </style>
</head>
<body>

  <!-- 上半部：全區凍結模組 -->
  <div class="sticky-top-panel">
    
    <div class="banner">
      <span>BP Tracker</span>
      <button class="refresh-btn" onclick="window.location.reload()" title="Refresh Time">↻</button>
    </div>
    
    <div class="container" style="padding-bottom: 5px;">
      <form id="bpForm">
        <div class="form-group date-time-layout">
          <div class="date-box"><input type="date" id="date" required></div>
          <div class="time-box"><input type="time" id="time" required></div>
        </div>
        
        <div class="form-group bp-hr-row">
          <input type="number" id="systolic" placeholder="SBP" inputmode="numeric" pattern="[0-9]*" required>
          <span class="symbol">/</span>
          <input type="number" id="diastolic" placeholder="DBP" inputmode="numeric" pattern="[0-9]*" required>
          <span class="unit">mmHg</span>
          <input type="number" id="heartRate" placeholder="HR" inputmode="numeric" pattern="[0-9]*" required>
          <span class="unit" style="margin-right:0;">bpm</span>
        </div>
        
        <div class="form-group notes-save-row" style="margin-bottom: 0;">
          <input type="text" id="notes" placeholder="Notes (e.g., dizzy...)">
          <button type="submit" id="submitBtn" class="primary-btn">Save</button>
        </div>
      </form>
    </div>

    <div class="banner" style="margin-top: 10px;">
      <span>Records</span>
      <div class="capsule-group">
        <button class="capsule-btn" data-val="7days">7 days</button>
        <button class="capsule-btn active" data-val="30days">30 days</button>
        <button class="capsule-btn" data-val="all">All</button>
      </div>
    </div>
    
    <div class="container" style="padding-top: 15px; padding-bottom: 0;">
      <div class="list-header">
        <div>Date</div><div>Time</div><div>BP</div><div>HR</div><div>Notes</div>
      </div>
    </div>

  </div> 

  <!-- 下半部：純資料列表 -->
  <div class="container" style="padding-top: 5px; padding-bottom: 40px;">
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';
    let allRecords = [];
    let currentFilter = '30days'; 

    const now = new Date();
    document.getElementById('date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    document.querySelectorAll('.capsule-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.capsule-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-val');
        renderList();
      });
    });

    function renderList() {
      let displayData = [...allRecords];

      if (currentFilter === '7days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
        displayData = displayData.filter(r => new Date(r.date.replace(/-/g, '/')) >= cutoff);
      } else if (currentFilter === '30days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
        displayData = displayData.filter(r => new Date(r.date.replace(/-/g, '/')) >= cutoff);
      }

      displayData.sort((a, b) => {
        let dtA = new Date(`${a.date.replace(/-/g, '/')} ${a.time}`);
        let dtB = new Date(`${b.date.replace(/-/g, '/')} ${b.time}`);
        return dtA - dtB; 
      });

      let html = '';

      if (displayData.length === 0) {
        html = `<div style="text-align:center; padding: 20px; color: #888;">No records found.</div>`;
      } else {
        let lastDate = null;

        displayData.forEach(item => {
          let dateObj = new Date(item.date);
          
          let formattedDate = item.date;
          if (!isNaN(dateObj)) {
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            formattedDate = `${y}/${m}/${d}`;
          } else {
            formattedDate = item.date.replace(/-/g, '/');
          }
          
          let timeParts = item.time.match(/(\d+):(\d+)/);
          let formattedTime = item.time;
          if (timeParts) {
            formattedTime = `${timeParts[1].padStart(2, '0')}:${timeParts[2].padStart(2, '0')}`;
          }

          let sysNum = parseInt(item.systolic, 10);
          let sysHtml = (sysNum >= 130) ? `<span class="high-bp">${item.systolic}</span>` : item.systolic;

          let displayDateText = (lastDate !== formattedDate) ? formattedDate : '';

          if (lastDate !== null && lastDate !== formattedDate) {
            html += `<div class="day-divider"></div>`;
          } else if (lastDate !== null) {
            html += `<div class="item-divider"></div>`;
          }
          lastDate = formattedDate;

          html += `
            <div class="record-row">
              <div>${displayDateText}</div>
              <div>${formattedTime}</div>
              <div class="bp-col-align">
                <span class="bp-sys">${sysHtml}</span>
                <span class="bp-slash">/</span>
                <span class="bp-dia">${item.diastolic}</span>
              </div>
              <div>${item.heartRate}</div>
              <div class="note-col">${item.notes || ''}</div>
            </div>
          `;
        });
      }
      document.getElementById('recordsList').innerHTML = html;
    }

    async function loadData() {
      try {
        let response = await fetch(API_URL);
        allRecords = await response.json();
        renderList();
      } catch (err) {
        document.getElementById('recordsList').innerHTML = '<div style="text-align:center; color:red; padding:20px;">Failed to load data.</div>';
      }
    }

    document.getElementById('bpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        notes: document.getElementById('notes').value
      };

      allRecords.push(payload); 
      renderList();

      document.getElementById('bpForm').reset();
      let curr = new Date();
      document.getElementById('date').value = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
      document.getElementById('time').value = `${String(curr.getHours()).padStart(2,'0')}:${String(curr.getMinutes()).padStart(2,'0')}`;

      const originalColor = btn.style.backgroundColor;
      btn.innerText = '✅ Saved!';
      btn.style.backgroundColor = '#4CAF50';
      
      setTimeout(() => { 
        btn.innerText = 'Save';
        btn.style.backgroundColor = originalColor;
        btn.disabled = false;
      }, 2000);

      fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(err => console.error('Background save failed:', err));
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
