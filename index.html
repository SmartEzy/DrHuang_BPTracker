<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #8FA3B8;
      --primary-dark: #495057; /* 改為深灰色 */
      --bg-color: #F4F6F8;
      --text-main: #333333;
      --border-color: #CED4DA;
      --special-color: #A39193;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 15px; 
    }
    
    /* 移除卡片，改用單純的 wrapper 限制最大寬度，並讓寬度更飽滿 */
    .wrapper {
      width: 100%; max-width: 500px; margin: 0 auto 30px auto;
    }
    
    /* 深灰底標題樣式 */
    .section-header {
      background-color: var(--primary-dark);
      color: white;
      padding: 10px 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-header select {
      background: #FFFFFF; color: var(--primary-dark);
      border: none; padding: 2px 6px; border-radius: 4px; font-size: 13px;
    }

    .form-group { margin-bottom: 15px; }
    #notesGroup { display: none; }
    
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--primary-dark); }
    
    input[type="number"], input[type="text"], input[type="date"], input[type="time"] {
      width: 100%; padding: 10px 6px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 15px; color: var(--text-main); background: #FFFFFF;
    }

    /* Type Radio Buttons 的新排版 */
    .type-radios {
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      margin-top: 22px; /* 對齊輸入框 */
    }
    .type-radios label { font-weight: normal; font-size: 14px; display: flex; align-items: center; gap: 4px; margin:0; }
    
    button {
      width: 100%; padding: 12px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    button:hover { background-color: #768B9E; }
    
    /* 列表分欄樣式 */
    .list-header {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1.5fr; 
      gap: 5px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
      font-weight: bold; font-size: 13px; color: var(--primary-dark);
      text-align: center;
    }
    .list-header div:first-child { text-align: left; }

    .record-item {
      padding: 12px 0; border-bottom: 1px solid var(--border-color);
    }
    
    .record-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1.5fr;
      gap: 5px;
      align-items: center;
      font-size: 15px; color: var(--text-main);
      text-align: center;
    }
    
    .record-row .dt-col { text-align: left; font-size: 13px; line-height: 1.4; }
    .dt-col span { color: #666; }
    
    .record-row .type-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .type-col .note-text {
      font-size: 11px; color: #888; margin-top: 4px; text-align: center; line-height: 1.1; word-break: break-word;
    }

    .circle-badge {
      display: inline-flex; justify-content: center; align-items: center;
      width: 20px; height: 20px; border-radius: 50%;
      font-size: 11px; font-weight: bold; color: white;
    }
    .badge-regular { background-color: var(--primary-color); }
    .badge-special { background-color: var(--special-color); }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="section-header">BP Tracker</div>
    <form id="bpForm">
      <!-- Date, Time, 還有 Type 放同一列 -->
      <div class="form-group" style="display:flex; gap:8px;">
        <div style="flex: 1.8;">
          <label>Date</label>
          <input type="date" id="date" required>
        </div>
        <div style="flex: 1.5;">
          <label>Time</label>
          <input type="time" id="time" required>
        </div>
        <!-- 上下排列的 Radio Buttons -->
        <div class="type-radios" style="flex: 1;">
          <label><input type="radio" name="type" value="Regular" checked> Reg</label>
          <label><input type="radio" name="type" value="Special"> Spec</label>
        </div>
      </div>
      
      <div class="form-group" id="notesGroup">
        <label>Notes</label><input type="text" id="notes" placeholder="e.g., dizzy, after exercise...">
      </div>
      
      <div class="form-group" style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>SBP</label><input type="number" id="systolic" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <label>DBP</label><input type="number" id="diastolic" inputmode="numeric" pattern="[0-9]*" required>
        </div>
        <div style="flex:1;">
          <label>HR</label><input type="number" id="heartRate" inputmode="numeric" pattern="[0-9]*" required>
        </div>
      </div>
      
      <button type="submit" id="submitBtn">Save Record</button>
      <div id="status" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <div class="wrapper">
    <div class="section-header">
      <span>Recent Records</span>
      <!-- 新增：筆數切換選單 -->
      <select id="limitSelect">
        <option value="5">Last 5</option>
        <option value="10">Last 10</option>
        <option value="20" selected>Last 20</option>
        <option value="all">All</option>
      </select>
    </div>
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';
    
    // 儲存從後端抓下來的所有資料
    let allRecords = [];

    // 初始化時間 (轉換為 YYYY-MM-DD 與 24H 格式以供 input 使用)
    const now = new Date();
    document.getElementById('date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    // 監聽 Radio Button
    const typeRadios = document.querySelectorAll('input[name="type"]');
    const notesGroup = document.getElementById('notesGroup');
    const notesInput = document.getElementById('notes');

    typeRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'Special') {
          notesGroup.style.display = 'block';
        } else {
          notesGroup.style.display = 'none';
          notesInput.value = '';
        }
      });
    });

    // 渲染列表的函式 (負責處理日期格式轉換與筆數過濾)
    function renderList() {
      const limitVal = document.getElementById('limitSelect').value;
      const displayData = limitVal === 'all' ? allRecords : allRecords.slice(0, parseInt(limitVal));

      let html = `
        <div class="list-header">
          <div>Date Time</div><div>BP</div><div>HR</div><div>Type</div>
        </div>
      `;

      if (displayData.length === 0) {
        html += `<div style="text-align:center; padding: 20px; color: #888;">No records found.</div>`;
      } else {
        displayData.forEach(item => {
          let isRegular = (item.type === 'Regular' || item.type === '規律測量');
          let badgeClass = isRegular ? 'badge-regular' : 'badge-special';
          let badgeLetter = isRegular ? 'R' : 'S';

          // 強制轉換日期格式為 YYYY/M/D (不補零)
          let dateObj = new Date(item.date);
          let formattedDate = isNaN(dateObj) ? item.date.replace(/-/g, '/') : `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
          
          // 強制擷取時間為 HH:MM (去掉秒數與 AM/PM，統一 24H)
          let timeParts = item.time.match(/(\d+):(\d+)/);
          let formattedTime = timeParts ? `${timeParts[1]}:${timeParts[2]}` : item.time;

          html += `
            <div class="record-item">
              <div class="record-row">
                <div class="dt-col">${formattedDate}<br><span>${formattedTime}</span></div>
                <div>${item.systolic}/${item.diastolic}</div>
                <div>${item.heartRate}</div>
                <div class="type-col">
                  <span class="circle-badge ${badgeClass}">${badgeLetter}</span>
                  ${item.notes ? `<span class="note-text">${item.notes}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        });
      }
      document.getElementById('recordsList').innerHTML = html;
    }

    // 監聽下拉選單變更，即時重新渲染
    document.getElementById('limitSelect').addEventListener('change', renderList);

    // 從 API 獲取資料
    async function loadData() {
      try {
        let response = await fetch(API_URL);
        allRecords = await response.json();
        renderList();
      } catch (err) {
        document.getElementById('recordsList').innerHTML = 'Failed to load data.';
      }
    }

    // 提交表單
    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true; btn.innerText = 'Saving...';

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        type: document.querySelector('input[name="type"]:checked').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        status.innerText = '✅ Saved!';
        status.style.color = 'green';
        setTimeout(() => { status.innerText = ''; }, 3000);
        
        document.getElementById('bpForm').reset();
        let curr = new Date();
        document.getElementById('date').value = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
        document.getElementById('time').value = `${String(curr.getHours()).padStart(2,'0')}:${String(curr.getMinutes()).padStart(2,'0')}`;
        notesGroup.style.display = 'none'; 
        
        // 重新讀取並刷新列表
        loadData();
      } catch (error) {
        status.innerText = '❌ Failed.';
        status.style.color = 'red';
      } finally {
        btn.disabled = false; btn.innerText = 'Save Record';
      }
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
