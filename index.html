<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #8FA3B8; /* 淡灰藍色 */
      --primary-dark: #768B9E;
      --bg-color: #F4F6F8; /* 淺灰底色 */
      --card-bg: #FFFFFF;
      --text-main: #495057; /* 灰色字體 */
      --border-color: #CED4DA;
      --emergency-color: #A88F8F;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    }
    .container {
      width: 100%; max-width: 400px; background: var(--card-bg);
      padding: 24px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: var(--primary-dark); text-align: center; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--text-main); }
    input[type="number"], input[type="date"], input[type="time"], input[type="text"] {
      width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #FAFAFA;
    }
    .radio-group { display: flex; gap: 15px; margin-top: 5px; }
    .radio-group label { font-weight: normal; font-size: 15px; display: flex; align-items: center; gap: 5px; }
    button {
      width: 100%; padding: 12px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    button:hover { background-color: var(--primary-dark); }
    
    /* 列表樣式更新 */
    .record-item {
      padding: 14px 0; border-bottom: 1px solid var(--border-color);
    }
    .record-item:last-child { border-bottom: none; }
    .record-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .datetime { font-size: 14px; font-weight: bold; color: var(--primary-dark); }
    
    /* 圓底標記樣式 */
    .circle-badge {
      display: inline-flex; justify-content: center; align-items: center;
      width: 24px; height: 24px; border-radius: 50%;
      font-size: 12px; font-weight: bold; color: white;
    }
    .badge-regular { background-color: var(--primary-color); }
    .badge-emergency { background-color: var(--emergency-color); }
    
    .numbers { font-size: 16px; font-weight: 500; color: var(--text-main); }
    .notes-text { color: #888; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>BP Tracker</h2>
    <form id="bpForm">
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>Date</label><input type="date" id="date" required>
        </div>
        <div style="flex:1;">
          <label>Time</label><input type="time" id="time" required>
        </div>
      </div>
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>SBP</label><input type="number" id="systolic" required>
        </div>
        <div style="flex:1;">
          <label>DBP</label><input type="number" id="diastolic" required>
        </div>
      </div>
      <div class="form-group">
        <label>HR</label><input type="number" id="heartRate" required>
      </div>
      <div class="form-group">
        <label>Type</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="Regular" checked> Regular</label>
          <label><input type="radio" name="type" value="Emergency"> Emergency</label>
        </div>
      </div>
      <div class="form-group">
        <label>Notes (Optional)</label><input type="text" id="notes" placeholder="e.g., after exercise, feeling dizzy...">
      </div>
      <button type="submit" id="submitBtn">Save Record</button>
      <div id="status" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <div class="container">
    <h2>Recent Records</h2>
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    // ⚠️ 請替換為您的 API 網址
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';

    // 預設填入當下時間
    const now = new Date();
    document.getElementById('date').value = now.toLocaleDateString('en-CA');
    document.getElementById('time').value = now.toLocaleTimeString('en-GB', { hour: "2-digit", minute: "2-digit" });

    // 載入資料列表
    async function loadData() {
      try {
        let response = await fetch(API_URL);
        let data = await response.json();
        let html = '';
        data.forEach(item => {
          // 判斷標記：支援新版的 'Regular' 或舊版的 '規律測量'
          let isRegular = (item.type === 'Regular' || item.type === '規律測量');
          let badgeClass = isRegular ? 'badge-regular' : 'badge-emergency';
          let badgeLetter = isRegular ? 'R' : 'E';

          html += `
            <div class="record-item">
              <div class="record-header">
                <span class="datetime">${item.date} ${item.time}</span>
                <span class="circle-badge ${badgeClass}">${badgeLetter}</span>
              </div>
              <div class="numbers">${item.systolic} / ${item.diastolic} mmHg &nbsp;&nbsp; ${item.heartRate} bpm</div>
              ${item.notes ? `<div class="notes-text">Notes: ${item.notes}</div>` : ''}
            </div>
          `;
        });
        document.getElementById('recordsList').innerHTML = html || 'No records found.';
      } catch (err) {
        document.getElementById('recordsList').innerHTML = 'Failed to load data. Please check API settings.';
      }
    }

    // 提交表單
    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true; btn.innerText = 'Saving...';

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        type: document.querySelector('input[name="type"]:checked').value,
        notes: document.getElementById('notes').value
      };

      try {
        // 使用 text/plain 避免 CORS 預檢請求錯誤
        await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        status.innerText = '✅ Saved Successfully!';
        status.style.color = 'green';
        setTimeout(() => { status.innerText = ''; }, 3000);
        
        // 重設表單，並重新填入當下時間
        document.getElementById('bpForm').reset();
        document.getElementById('date').value = new Date().toLocaleDateString('en-CA');
        document.getElementById('time').value = new Date().toLocaleTimeString('en-GB', { hour: "2-digit", minute: "2-digit" });
        loadData();
      } catch (error) {
        status.innerText = '❌ Failed to save. Please try again.';
        status.style.color = 'red';
      } finally {
        btn.disabled = false; btn.innerText = 'Save Record';
      }
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
