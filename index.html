<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-color: #8FA3B8;
      --primary-dark: #495057; 
      --bg-color: #F4F6F8;
      --text-main: #333333;
      --border-color: #CED4DA;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color); color: var(--text-main);
      margin: 0; padding: 0; 
    }
    
    .banner {
      background-color: var(--primary-dark);
      color: white;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .banner select {
      background: #FFFFFF; color: var(--primary-dark);
      border: none; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: bold;
    }

    .container {
      width: 100%; max-width: 500px; margin: 0 auto; padding: 15px 20px; box-sizing: border-box;
    }

    .form-group { margin-bottom: 12px; }
    
    /* 改用 CSS Grid 強制均分並產生間距，徹底解決手機重疊問題 */
    .grid-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    
    input[type="number"], input[type="text"], input[type="date"], input[type="time"] {
      width: 100%; padding: 12px 8px; border: 1px solid var(--border-color); border-radius: 6px;
      box-sizing: border-box; font-size: 16px; color: var(--text-main); background: #FFFFFF;
    }
    ::placeholder { color: #A0AAB5; }

    /* BP / HR 同列排版 */
    .bp-hr-row {
      display: flex; align-items: center; gap: 4px; width: 100%;
    }
    .bp-hr-row input {
      flex: 1; min-width: 0; text-align: center; padding: 12px 4px;
    }
    .symbol { font-size: 18px; color: #666; font-weight: 300; }
    .unit { font-size: 13px; color: #666; margin-right: 4px; }

    button.primary-btn {
      width: 100%; padding: 14px; background-color: var(--primary-color); color: white;
      border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px;
    }
    button.primary-btn:hover { background-color: #768B9E; }
    
    /* 列表清單樣式 */
    .list-header {
      display: grid;
      grid-template-columns: 1.8fr 1.2fr 2fr 1fr 2fr; 
      gap: 4px; padding-bottom: 8px; border-bottom: 2px solid var(--primary-dark);
      font-weight: bold; font-size: 12px; color: var(--primary-dark); text-align: center;
    }
    .list-header div:first-child { text-align: left; }
    .list-header div:last-child { text-align: left; }

    .record-row {
      display: grid; grid-template-columns: 1.8fr 1.2fr 2fr 1fr 2fr;
      gap: 4px; align-items: center; padding: 10px 0;
      font-size: 13px; color: var(--text-main); text-align: center;
    }
    .record-row div:first-child { text-align: left; }
    .record-row div:last-child { text-align: left; }
    
    .note-col {
      font-size: 11px; color: #666; word-break: break-word; line-height: 1.2;
    }

    /* 日期分隔線 */
    .day-divider { border-top: 2px solid var(--primary-color); margin: 2px 0; }
    .item-divider { border-top: 1px dashed #E2E8F0; }

  </style>
</head>
<body>

  <!-- 輸入區橫幅 -->
  <div class="banner">BP Tracker</div>
  
  <div class="container">
    <form id="bpForm">
      <!-- Date & Time 改為 Grid 排版 -->
      <div class="form-group grid-row-2">
        <input type="date" id="date" required>
        <input type="time" id="time" required>
      </div>
      
      <!-- SBP / DBP mmHg HR bpm -->
      <div class="form-group bp-hr-row">
        <input type="number" id="systolic" placeholder="SBP" inputmode="numeric" pattern="[0-9]*" required>
        <span class="symbol">/</span>
        <input type="number" id="diastolic" placeholder="DBP" inputmode="numeric" pattern="[0-9]*" required>
        <span class="unit">mmHg</span>
        <input type="number" id="heartRate" placeholder="HR" inputmode="numeric" pattern="[0-9]*" required style="margin-left: 2px;">
        <span class="unit" style="margin-right: 0;">bpm</span>
      </div>
      
      <!-- Notes -->
      <div class="form-group">
        <input type="text" id="notes" placeholder="Notes (e.g., dizzy, felt unwell...)">
      </div>
      
      <button type="submit" id="submitBtn" class="primary-btn">Save Record</button>
      <div id="status" style="text-align: center; margin-top: 10px; font-size: 14px;"></div>
    </form>
  </div>

  <!-- 列表區橫幅與選單 -->
  <div class="banner" style="margin-top: 5px;">
    <span>Recent Records</span>
    <select id="limitSelect">
      <!-- 統一改為時間維度 -->
      <option value="7days" selected>Last 7 Days</option>
      <option value="30days">Last 30 Days</option>
      <option value="all">All</option>
    </select>
  </div>
  
  <div class="container" style="padding-top: 15px;">
    <div id="recordsList">Loading...</div>
  </div>

  <script>
    // 綁定您的 API
    const API_URL = 'https://script.google.com/macros/s/AKfycbxST5su2Cygqux4p5gBBApo8Gjq4QLt2-CpNFEjjQFZSEHZqMTJ06sxA7HjptHiQWNK/exec';
    let allRecords = [];

    const now = new Date();
    document.getElementById('date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    function renderList() {
      const limitVal = document.getElementById('limitSelect').value;
      let displayData = [];

      if (limitVal === '7days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
        displayData = allRecords.filter(r => new Date(r.date) >= cutoff);
      } else if (limitVal === '30days') {
        let cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
        displayData = allRecords.filter(r => new Date(r.date) >= cutoff);
      } else {
        displayData = allRecords;
      }

      let html = `
        <div class="list-header">
          <div>Date</div><div>Time</div><div>BP</div><div>HR</div><div>Notes</div>
        </div>
      `;

      if (displayData.length === 0) {
        html += `<div style="text-align:center; padding: 20px; color: #888;">No records found.</div>`;
      } else {
        let lastDate = null;

        displayData.forEach(item => {
          let dateObj = new Date(item.date);
          let formattedDate = isNaN(dateObj) ? item.date.replace(/-/g, '/') : `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
          
          let timeParts = item.time.match(/(\d+):(\d+)/);
          let formattedTime = item.time;
          if (timeParts) formattedTime = `${parseInt(timeParts[1], 10)}:${parseInt(timeParts[2], 10)}`;

          if (lastDate !== null && lastDate !== formattedDate) {
            html += `<div class="day-divider"></div>`;
          } else if (lastDate !== null) {
            html += `<div class="item-divider"></div>`;
          }
          lastDate = formattedDate;

          html += `
            <div class="record-row">
              <div>${formattedDate}</div>
              <div>${formattedTime}</div>
              <div>${item.systolic}/${item.diastolic}</div>
              <div>${item.heartRate}</div>
              <div class="note-col">${item.notes || ''}</div>
            </div>
          `;
        });
      }
      document.getElementById('recordsList').innerHTML = html;
    }

    document.getElementById('limitSelect').addEventListener('change', renderList);

    async function loadData() {
      try {
        let response = await fetch(API_URL);
        allRecords = await response.json();
        renderList();
      } catch (err) {
        document.getElementById('recordsList').innerHTML = '<div style="text-align:center; color:red; padding:20px;">Failed to load data.</div>';
      }
    }

    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      btn.disabled = true; btn.innerText = 'Saving...';

      const payload = {
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        systolic: document.getElementById('systolic').value,
        diastolic: document.getElementById('diastolic').value,
        heartRate: document.getElementById('heartRate').value,
        notes: document.getElementById('notes').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        status.innerText = '✅ Saved!';
        status.style.color = 'green';
        setTimeout(() => { status.innerText = ''; }, 3000);
        
        document.getElementById('bpForm').reset();
        let curr = new Date();
        document.getElementById('date').value = `${curr.getFullYear()}-${String(curr.getMonth()+1).padStart(2,'0')}-${String(curr.getDate()).padStart(2,'0')}`;
        document.getElementById('time').value = `${String(curr.getHours()).padStart(2,'0')}:${String(curr.getMinutes()).padStart(2,'0')}`;
        
        loadData();
      } catch (error) {
        status.innerText = '❌ Failed.';
        status.style.color = 'red';
      } finally {
        btn.disabled = false; btn.innerText = 'Save Record';
      }
    });

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
